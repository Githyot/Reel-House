# Diagnostic only (nothing is built or released): plays one episode's torrent the way the Android app does
# (embedded torrent engine + libmpv with the app's options) and logs how fast the video buffers.
name: Torrent probe
on:
  push:
    branches: ["probe/**"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: libmpv
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libmpv2 >/dev/null && ls /usr/lib/x86_64-linux-gnu/libmpv*
      - name: Probe
        run: |
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libmpv.so.2 /usr/lib/x86_64-linux-gnu/libmpv.so || true
          cargo build --release --example torrent_probe --features torrent-embed 2>&1 | tail -n 3
          PROBE_HASH=520cf21103a92b48fbf5b1282e8be40d6faa9d1c ./target/release/examples/torrent_probe tt0168366 6 3 2>&1 | cut -c1-300
