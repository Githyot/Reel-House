# Builds the Linux app (x86_64) and packs it as a .deb and a .rpm: the Rust core, then the Qt app with Qt 6.8.3 from
# aqtinstall (Ubuntu's own Qt is older than the 6.6 the app needs). linuxdeploy copies Qt, its plugins and the QML
# modules next to the program, and nfpm packs that tree into /opt/reelhouse with a `reelhouse` command, a menu entry
# and the icon (packaging/linux/). Video plays through the system's libmpv, a dependency of both packages.
# Built on Ubuntu 22.04 so the packages also run on older systems (glibc 2.35: Ubuntu 22.04+, Debian 12+, Fedora 37+).
# Built on the owner's Fedora runner, they need that Fedora's glibc or newer (older Ubuntu/Debian may refuse them).
# Not in these builds: Chromium for Research mode (it opens pages in the system browser) and Suwayomi.
# Runs by hand (Actions > Build Linux > Run workflow), on version tags; never on pull requests.
# A tag attaches both packages to the Release; so does a manual run with a version filled in (like windows.yml).
# No pull_request trigger on purpose: these jobs can run on the owner's own PC (self-hosted runner), and a public
# repository must never run a stranger's pull request there.
name: Build Linux
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Attach the .deb and .rpm to the Release with this version (e.g. v0.4.0); leave empty for a plain build"
        required: false
        default: ""
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
env:
  QT_VERSION: 6.8.3
  # the version the app reports and compares with the Releases (src/updater.rs): v0.5.1 on a release build, else Cargo.toml
  REELHOUSE_RELEASE: ${{ inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
jobs:
  linux:
    # GitHub's machines by default; the owner's own PC when the repository variable RUNNER_LINUX names its runner label
    # (rh-linux, a runner on the owner's Fedora PC or WSL Ubuntu: Settings > Secrets and variables > Actions > Variables). Self-hosted runners cost no Actions minutes.
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-22.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: System packages and Rust (apt on GitHub's Ubuntu, dnf on the owner's Fedora)
        run: bash .github/scripts/host-packages.sh linux
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          # pictures as WebP/TIFF (qtimageformats), the microphone of Conversation (qtmultimedia), the offline voice (qtspeech)
          modules: qtimageformats qtmultimedia qtspeech
          dir: ${{ runner.temp }}/qt
          cache: true
          # a self-hosted runner (Fedora) uses the system's python3 for aqtinstall: setup-python has no Fedora builds
          setup-python: ${{ runner.environment == 'github-hosted' }}
          # apt-get install of Qt's build dependencies; on Fedora host-packages.sh installed them with dnf
          install-deps: ${{ runner.environment == 'github-hosted' }}
      - name: Restore the Rust cache
        id: rcache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-qt
          key: linux-${{ hashFiles('qtbridge/Cargo.lock', 'Cargo.lock') }}
          restore-keys: linux-
      - name: Fetch rqbit and the Anime4K shaders into assets/
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash fetch-assets.sh linux
      # Research mode draws pages with Chromium (CEF, BSD licence): the "minimal" Linux build of the same CEF version
      # as Windows (msys-build-qt.sh), checked against the SHA-1 the CEF build server lists. CMake then builds
      # reelhouse-cef-helper and turns REELHOUSE_CEF on. Without it Research mode opens pages in the system browser.
      - name: Chromium (CEF)
        run: |
          CEF_VERSION="154.0.34+g14c5a08+chromium-154.0.8037.98"
          name="cef_binary_${CEF_VERSION}_linux64_minimal"
          cef=qt/third_party/cef
          if [ "$(cat $cef/VERSION.reelhouse 2>/dev/null)" = "$CEF_VERSION" ] && [ -f $cef/Release/libcef.so ]; then echo "cached"; exit 0; fi
          set +e
          sha=$(curl -fsSL --retry 3 https://cef-builds.spotifycdn.com/index.json | jq -r --arg v "$CEF_VERSION" --arg n "$name.tar.bz2" '.linux64.versions[] | select(.cef_version == $v) | .files[] | select(.name == $n) | .sha1')
          url="https://cef-builds.spotifycdn.com/$(printf '%s' "$name" | sed 's/+/%2B/g').tar.bz2"
          if [ -z "$sha" ] || ! curl -fsSL --retry 3 -o "$RUNNER_TEMP/cef.tar.bz2" "$url" || [ "$(sha1sum "$RUNNER_TEMP/cef.tar.bz2" | cut -d' ' -f1)" != "$sha" ]; then
            echo "::warning::Chromium (CEF) could not be downloaded or its checksum is wrong: Research mode will open pages in the system browser"
            exit 0
          fi
          rm -rf $cef && mkdir -p qt/third_party && tar -xjf "$RUNNER_TEMP/cef.tar.bz2" -C qt/third_party && mv "qt/third_party/$name" $cef
          rm -rf $cef/libcef_dll $cef/cmake $cef/bazel
          echo "$CEF_VERSION" > $cef/VERSION.reelhouse
          du -sh $cef/Release $cef/Resources
      - name: Rust core
        run: |
          cargo --version
          cargo build --release --manifest-path qtbridge/Cargo.toml --target-dir target-qt > rust-linux.log 2>&1 || { tail -n 80 rust-linux.log; exit 1; }
          ls -la target-qt/release/libreelhouse_qtbridge.a
      # saved as soon as the core is built, so that a later failing step still leaves it for the next run
      - name: Save the Rust cache
        if: steps.rcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-qt
          key: linux-${{ hashFiles('qtbridge/Cargo.lock', 'Cargo.lock') }}
      - name: Build (CMake)
        run: |
          set -o pipefail
          cmake -S qt -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DREELHOUSE_BUILD_RUST=OFF -DREELHOUSE_RUST_LIB="$PWD/target-qt/release/libreelhouse_qtbridge.a" 2>&1 | tee build-linux.log
          cmake --build build-linux 2>&1 | tee -a build-linux.log
      - name: Bundle Qt (linuxdeploy)
        run: |
          cd "$RUNNER_TEMP"
          for t in linuxdeploy/linuxdeploy/linuxdeploy-x86_64 linuxdeploy/linuxdeploy-plugin-qt/linuxdeploy-plugin-qt-x86_64; do
            curl -fsSL --retry 3 -o "${t##*/}.AppImage" "https://github.com/${t%/*}/releases/download/continuous/${t##*/}.AppImage"
            chmod +x "${t##*/}.AppImage"
          done
          cd "$GITHUB_WORKSPACE"
          # no FUSE on the runner; qmake tells the Qt plugin where Qt is; the QML files are scanned for their imports
          export APPIMAGE_EXTRACT_AND_RUN=1 QMAKE="$QT_ROOT_DIR/bin/qmake" QML_SOURCES_PATHS="$PWD/qt/qml"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}"
          # the SVG pictures (mascot, icons) load through the svg image plugin, which nothing links to
          export EXTRA_QT_MODULES="svg" EXTRA_QT_PLUGINS="svg"
          # linuxdeploy's own strip is too old for newer systems' libraries (.relr.dyn on Fedora): skip it there
          if [ "$RUNNER_ENVIRONMENT" != "github-hosted" ]; then export NO_STRIP=1; fi
          set +e
          "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage" --appdir AppDir --executable build-linux/reelhouse-qt --plugin qt > linuxdeploy.log 2>&1
          code=$?
          set -e
          grep -E "ERROR|WARNING|blacklisted" linuxdeploy.log | cut -c1-200 | sort -u | head -80 || true
          if [ $code -ne 0 ]; then tail -n 60 linuxdeploy.log | cut -c1-250; exit $code; fi
          # on GNOME the program asks for the desktop portal theme (colours, native file dialogs; see main.cpp), a
          # plugin that linuxdeploy leaves out
          pt="$QT_ROOT_DIR/plugins/platformthemes/libqxdgdesktopportal.so"
          if [ -f "$pt" ] && [ ! -f AppDir/usr/plugins/platformthemes/libqxdgdesktopportal.so ]; then
            mkdir -p AppDir/usr/plugins/platformthemes && cp -f "$pt" AppDir/usr/plugins/platformthemes/
            patchelf --set-rpath '$ORIGIN/../../lib' AppDir/usr/plugins/platformthemes/libqxdgdesktopportal.so
            ldd AppDir/usr/plugins/platformthemes/libqxdgdesktopportal.so | grep -E "not found|Qt6" || true
          fi
          # the offline voice (LocalTts.qml): Qt's speech-dispatcher backend, also left out by linuxdeploy; it loads
          # when the system has libspeechd (a recommended package), otherwise the app simply has no local voice
          tts="$QT_ROOT_DIR/plugins/texttospeech/libqtexttospeech_speechd.so"
          if [ -f "$tts" ] && [ ! -f AppDir/usr/plugins/texttospeech/libqtexttospeech_speechd.so ]; then
            mkdir -p AppDir/usr/plugins/texttospeech && cp -f "$tts" AppDir/usr/plugins/texttospeech/
            patchelf --set-rpath '$ORIGIN/../../lib' AppDir/usr/plugins/texttospeech/libqtexttospeech_speechd.so
          fi
          # Libraries every desktop system has are taken from it, not bundled: the player loads the system's libmpv,
          # whose own dependencies (GLib, D-Bus, PulseAudio, systemd, compression…) need that system's versions. Copies
          # from the build machine, older than Fedora's, were loaded first and broke it ("undefined symbol: g_dir_unref").
          # nfpm.yaml lists them as dependencies instead. Qt, ICU, Qt's FFmpeg and the xcb helpers stay bundled.
          for l in libglib-2.0 libgobject-2.0 libgio-2.0 libgmodule-2.0 libgthread-2.0 libffi libpcre libpcre2-8 \
                   libdbus-1 libsystemd libselinux libmount libblkid libgcrypt libcap libapparmor \
                   libpulse libpulsecommon libasyncns libsndfile libFLAC libogg libopus libvorbis libvorbisenc \
                   libbz2 liblzma liblz4 libzstd libbrotlicommon libbrotlidec libpng16 \
                   libgssapi_krb5 libkrb5 libk5crypto libkrb5support libkeyutils; do
            rm -fv AppDir/usr/lib/$l.so* AppDir/usr/lib/$l-*.so 2>/dev/null | sed 's/^/unbundled: /'
          done
          # Research mode: Chromium's files go next to the program (libcef.so and the libraries it loads, its V8
          # snapshot, the .pak resources, icudtl.dat and the locales of the app's languages), with the helper.
          cef=qt/third_party/cef
          if [ -f $cef/Release/libcef.so ] && [ -f build-linux/reelhouse-cef-helper ]; then
            for f in $cef/Release/*.so $cef/Release/*.so.* $cef/Release/*.bin $cef/Release/*.json; do [ -f "$f" ] && cp -f "$f" AppDir/usr/bin/; done
            cp -f $cef/Resources/*.pak $cef/Resources/icudtl.dat AppDir/usr/bin/
            mkdir -p AppDir/usr/bin/locales
            for l in en-US pt-BR pt-PT es es-419 ja; do cp -f $cef/Resources/locales/"$l"*.pak AppDir/usr/bin/locales/ 2>/dev/null || true; done
            cp -f build-linux/reelhouse-cef-helper AppDir/usr/bin/
            strip --strip-unneeded AppDir/usr/bin/libcef.so 2>/dev/null || true
            echo "Chromium (CEF): $(du -h AppDir/usr/bin/libcef.so | cut -f1) libcef.so, $(ls AppDir/usr/bin/locales | wc -l) locale files"
          else
            echo "::warning::Chromium (CEF) or reelhouse-cef-helper missing: Research mode will open pages in the system browser"
          fi
          # the Learn course packs and the kana sounds go next to the program, the first place the core looks
          mkdir -p AppDir/usr/bin/learn AppDir/usr/bin/kana
          cp -f assets/learn/*.json AppDir/usr/bin/learn/
          cp -f assets/kana/*.ogg assets/kana/CREDITS.md AppDir/usr/bin/kana/
          cat AppDir/usr/bin/qt.conf
          du -sh AppDir/usr AppDir/usr/lib AppDir/usr/plugins AppDir/usr/qml 2>/dev/null || true
          ls AppDir/usr/plugins
      - name: Package (.deb and .rpm, nfpm)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          exec > >(tee package.log) 2>&1
          gh release download -R goreleaser/nfpm -p 'nfpm_*_Linux_x86_64.tar.gz' -D "$RUNNER_TEMP/nfpm" --clobber
          tar -xzf "$RUNNER_TEMP"/nfpm/nfpm_*_Linux_x86_64.tar.gz -C "$RUNNER_TEMP/nfpm" nfpm
          NFPM="$RUNNER_TEMP/nfpm/nfpm"; "$NFPM" --version | head -3
          # the release version (v0.5.1 -> 0.5.1), else the core's version marked as a development build
          if [[ "$RELEASE" == v* ]]; then export RH_VERSION="${RELEASE#v}"
          else export RH_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "package version: $RH_VERSION"
          mkdir -p dist
          "$NFPM" package -f packaging/linux/nfpm.yaml -p deb -t dist/ReelHouse-linux-x86_64.deb
          "$NFPM" package -f packaging/linux/nfpm.yaml -p rpm -t dist/ReelHouse-linux-x86_64.rpm
          # the program folder (/opt/reelhouse) as a zip: an installed app downloads only the files that changed from it
          # (src/update_delta.rs). Python's zipfile keeps the Unix permissions and follows symlinks.
          python3 - <<'PY'
          import os, zipfile
          root = "AppDir/usr"
          with zipfile.ZipFile("dist/ReelHouse-linux-x86_64.zip", "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for d, _, files in sorted(os.walk(root)):
                  for f in sorted(files):
                      p = os.path.join(d, f)
                      z.write(p, os.path.relpath(p, root))
          PY
          ls -la dist
          dpkg-deb --info dist/ReelHouse-linux-x86_64.deb
          dpkg-deb --contents dist/ReelHouse-linux-x86_64.deb | grep -E " ./usr/|reelhouse-qt$|qt.conf$" | cut -c1-160
      - name: Report (a notice on the run page)
        run: |
          set +e
          {
            echo "deb $(du -h dist/ReelHouse-linux-x86_64.deb | cut -f1), rpm $(du -h dist/ReelHouse-linux-x86_64.rpm | cut -f1), AppDir $(du -sh AppDir/usr | cut -f1)"
            dpkg-deb -f dist/ReelHouse-linux-x86_64.deb Version Depends
            echo "rqbit: $(wc -c < assets/rqbit 2>/dev/null || echo none) bytes; shaders: $(ls assets/shaders/*.glsl 2>/dev/null | wc -l)"
            echo "plugins: $(cd AppDir/usr/plugins && ls -d */* | tr '\n' ' ')"
            echo "qml: $(ls AppDir/usr/qml | tr '\n' ' ')"
            echo "lib: $(ls AppDir/usr/lib | tr '\n' ' ')"
            echo "left to the system by linuxdeploy: $(grep -iE 'blacklist|exclud' linuxdeploy.log | grep -oE '[^ /]+\.so[.0-9]*' | sort -u | tr '\n' ' ')"
            echo "linuxdeploy warnings:"; grep -E "WARNING|ERROR" linuxdeploy.log | grep -v "copyright files" | cut -c1-200 | sort -u | head -15
            echo "not found by ldd:"
            find AppDir -type f -name '*.so*' -o -type f -path '*/bin/*' | while read -r f; do
              if file -b "$f" | grep -q ELF; then ldd "$f" 2>/dev/null | grep "not found" | sed "s|^|${f#AppDir/usr/}: |"; fi
            done | sort -u | head -25
          } > report.txt 2>&1
          python3 -c 'import sys
          out, cur = [], ""
          for l in open("report.txt", errors="replace").read().splitlines():
              l = l[:3200]
              if len(cur) + len(l) > 3200: out.append(cur); cur = ""
              cur += l + "\n"
          out.append(cur)
          for i, t in enumerate(out):
              print("::notice title=Linux build (%d/%d)::" % (i + 1, len(out)) + t.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))'
      - name: Errors as annotations (shown on the run page)
        if: failure()
        run: |
          cat > "$RUNNER_TEMP/annotate.py" <<'PY'
          import re, sys
          f = sys.argv[1]
          lines = open(f, errors="replace").read().splitlines()
          pat = re.compile(r"error|FAILED|undefined|Undefined symbols|ld: |CMake Error|not found|No such file", re.I)
          seen, hits = set(), []
          for l in lines:
              if pat.search(l) and "warning" not in l.lower() and l not in seen:
                  seen.add(l)
                  hits.append(l)
          body = hits[:45] + ["---- last lines ----"] + lines[-25:]
          msg = "\n".join(l[:300] for l in body).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title={f}::{msg}")
          PY
          for f in rust-linux.log build-linux.log linuxdeploy.log package.log; do
            if [ -f "$f" ]; then python3 "$RUNNER_TEMP/annotate.py" "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: linux-build-log
          path: |
            rust-linux.log
            build-linux.log
            linuxdeploy.log
            package.log
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ReelHouse-linux-x86_64
          path: |
            dist/ReelHouse-linux-x86_64.deb
            dist/ReelHouse-linux-x86_64.rpm
            dist/ReelHouse-linux-x86_64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          # only the zip the app updates itself from (HP, 2026-11-05); the .rpm / .deb stay in the run's artifact
          files: dist/ReelHouse-linux-x86_64.zip
          append_body: true
          body: |
            **Linux (x86_64):** o app instalado atualiza sozinho com `ReelHouse-linux-x86_64.zip` (só os arquivos que mudaram).

  # Installs the .rpm on a current Fedora and loads the system's libmpv the way the program does (its bundled
  # libraries first), so a bundled library that clashes with the system's fails here, not on the user's machine.
  fedora-check:
    needs: linux
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ReelHouse-linux-x86_64
      - name: Install and load
        run: |
          dnf -y -q install ./ReelHouse-linux-x86_64.rpm python3 file > dnf.log 2>&1 || { tail -40 dnf.log; exit 1; }
          rpm -q mpv-libs reelhouse
          echo "missing libraries:"; ldd /opt/reelhouse/bin/reelhouse-qt | grep "not found" && exit 1 || echo none
          LD_BIND_NOW=1 LD_LIBRARY_PATH=/opt/reelhouse/lib python3 -c 'import ctypes
          for l in ["libQt6Core.so.6", "libQt6Gui.so.6", "libmpv.so.2"]:
              ctypes.CDLL(l, mode=ctypes.RTLD_GLOBAL)
              print("loaded", l)
          m = ctypes.CDLL("libmpv.so.2"); m.mpv_create.restype = ctypes.c_void_p
          h = m.mpv_create(); assert h, "mpv_create failed"
          assert m.mpv_initialize(ctypes.c_void_p(h)) == 0, "mpv_initialize failed"
          print("libmpv works")'
          echo "QML modules: $(ls /opt/reelhouse/qml/QtQuick | tr '\n' ' ')"
          # start the program without a screen and keep what Qt and QML complain about (a missing module or plugin
          # leaves parts of the window empty, such as the icons drawn with QtQuick.Shapes)
          dnf -y -q install mesa-dri-drivers mesa-libEGL fontconfig > /dev/null 2>&1
          QT_QPA_PLATFORM=offscreen QT_LOGGING_RULES="qt.scenegraph.general=true;qt.rhi.general=true" timeout 40 /opt/reelhouse/bin/reelhouse-qt > run.log 2>&1 || echo "program ended with $?"
          echo "program output (last lines):"; tail -n 40 run.log | cut -c1-220
          echo "program output (warnings):"; grep -iE "not installed|is not a type|cannot|failed|error|warning|plugin" run.log | sort | uniq -c | sort -rn | cut -c1-220 | head -40
          if grep -qiE "module \"[^\"]+\" is not installed" run.log; then echo "::error::a QML module is missing from the package"; exit 1; fi
          if [ -f /opt/reelhouse/bin/libcef.so ]; then
            echo "Chromium libraries missing on a bare Fedora (installed with the desktop):"
            ldd /opt/reelhouse/bin/libcef.so | grep "not found" || echo none
          else
            echo "::warning::no libcef.so in the package"
          fi
