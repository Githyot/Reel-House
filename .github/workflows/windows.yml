# Builds the Windows app (Rust core + Qt) the same way build-qt.ps1 does on the owner's PC, and
# publishes a zip. Runs by hand (Actions > Build > Run workflow) and on version tags (v0.4.0, ...),
# never on pull requests. A tag also creates a Release that friends download;
# so does a manual run with a version filled in (the Release then creates the tag itself).
# No pull_request trigger on purpose: these jobs can run on the owner's own PC (self-hosted runner), and a public
# repository must never run a stranger's pull request there.
name: Build
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a Release with this version (e.g. v0.4.0); leave empty for a plain build"
        required: false
        default: ""
  push:
    tags: ["v*"]
permissions:
  contents: write
# a newer push to the same branch stops the older build (Windows minutes count double)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
env:
  # the version the app reports and compares with the Releases (src/updater.rs): v0.5.1 on a release build, else Cargo.toml
  REELHOUSE_RELEASE: ${{ inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
jobs:
  windows:
    # GitHub's machines by default; the owner's own PC when the repository variable RUNNER_WINDOWS names its runner label
    # (rh-windows: Settings > Secrets and variables > Actions > Variables). Self-hosted runners cost no Actions minutes.
    runs-on: ${{ vars.RUNNER_WINDOWS || 'windows-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch libmpv, rqbit and Anime4K shaders into assets/
        # Windows PowerShell: always there, also on a PC without PowerShell 7
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./fetch-assets.ps1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # on the owner's PC: the MSYS2 already at C:\msys64 (build-qt.ps1 uses it), not a fresh copy each run
          release: ${{ runner.environment == 'github-hosted' }}
          update: ${{ runner.environment == 'github-hosted' }}
          install: >-
            mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-declarative mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-imageformats mingw-w64-x86_64-qt6-svg mingw-w64-x86_64-qt6-multimedia mingw-w64-x86_64-qt6-speech mingw-w64-x86_64-rust mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-toolchain mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libjpeg-turbo mingw-w64-x86_64-libwebp mingw-w64-x86_64-libpng mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-giflib tar bzip2 zip
      - uses: actions/cache@v4
        with:
          path: |
            target-qt
            qt/third_party/cef
          key: win-${{ hashFiles('qtbridge/Cargo.lock', 'Cargo.lock', 'msys-build-qt.sh') }}
          restore-keys: win-
      - name: Test core
        shell: msys2 {0}
        run: |
          set +e
          cargo test --lib 2>&1 | tee test-core.log
          code=${PIPESTATUS[0]}
          # the first lines that explain a failure, shown as annotations on the run page
          grep -E "^error|panicked at|^test .* FAILED|^failures:" test-core.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
          exit $code
      - name: Build (msys-build-qt.sh)
        shell: msys2 {0}
        run: bash msys-build-qt.sh
      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p dist/ReelHouse
          cd qt/build
          tar cf - --exclude=CMakeFiles --exclude='*_autogen' --exclude=.rcc --exclude=.qt --exclude='*.ninja' \
            --exclude='.ninja_*' --exclude=CMakeCache.txt --exclude='*.cmake' --exclude=debug --exclude='*.o' \
            --exclude='*.a' --exclude=meta_types --exclude=qmltypes . | tar xf - -C ../../dist/ReelHouse
          cd ../../dist
          cp ../LICENSE ReelHouse/
          ls ReelHouse
          zip -qr ReelHouse-windows.zip ReelHouse
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: build-log
          path: build-qt.log
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ReelHouse-windows
          path: dist/ReelHouse
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/ReelHouse-windows.zip
          # every workflow of a version adds its paragraph to the Release text
          append_body: true
          body: |
            Baixe **ReelHouse-windows.zip**, extraia e abra `reelhouse-qt.exe`.
            Achou um problema ou tem uma ideia? Abra uma Issue em "Feedback".
