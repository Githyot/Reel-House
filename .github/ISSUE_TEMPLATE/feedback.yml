name: Feedback
description: Conte um problema, uma ideia ou o que achou do app
labels: ["feedback"]
body:
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options: ["Problema (algo quebrou)", "Ideia ou pedido", "Opinião geral"]
    validations:
      required: true
  - type: dropdown
    id: modo
    attributes:
      label: Em qual parte do app?
      options: ["Vídeo", "Imagens (mangá/HQ)", "Texto (novel/EPUB)", "Estudo", "Preferências", "Outra"]
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu ou o que você quer?
      description: Para problemas, diga o que fez, o que esperava e o que aconteceu.
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do app e do Windows
      placeholder: "v0.4.0, Windows 11"
  - type: textarea
    id: log
    attributes:
      label: Log (opcional)
      description: Preferências > Geral > Diagnóstico > Relatório de depuração gera debug/reelhouse-debug.log. Arraste o arquivo para cá.
