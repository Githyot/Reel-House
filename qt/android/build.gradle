// Qt 6.8.3's Android template (qtbase/src/android/templates/build.gradle) with Kotlin and the libraries of the
// extension host added (src/org/reelhouse/ext, src/eu/kanade/tachiyomi; docs/android-extensions.md).
// androiddeployqt fills gradle.properties (qtAndroidDir, qtGradlePluginType, SDK levels...); keep those names.
//
// Versions: Kotlin and the libraries follow Mihon's gradle/libs.versions.toml (commit e588e043), except OkHttp:
// 5.4+ requires compileSdk 36/37 (aar metadata), while Qt 6.8 builds with compileSdk 34 and AGP 8.6, so 5.3.2, the
// newest one without that requirement. Kotlin 2.4.21 supports AGP 8.5.2 to 9.3.1 and Gradle 7.6.3 to 9.7.

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        //noinspection AndroidGradlePluginVersion
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
        classpath 'org.jetbrains.kotlin:kotlin-serialization:2.4.21'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: qtGradlePluginType
apply plugin: 'kotlin-android'
apply plugin: 'kotlinx-serialization'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    //noinspection GradleDependency
    implementation 'androidx.core:core:1.13.1'

    // What extension APKs expect the host to provide (they compile against these with compileOnly), as Mihon
    // ships them. They are looked up by name at run time, so nothing here may be shrunk or renamed (no R8).
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.okhttp3:okhttp-brotli:5.3.2'
    // extensions built on OkHttp 5 add zstd decoding to their clients (okhttp3.zstd)
    implementation 'com.squareup.okhttp3:okhttp-zstd:5.3.2'
    implementation 'com.squareup.okio:okio:3.18.2'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'io.reactivex:rxjava:1.3.8'
    implementation 'uy.kohesive.injekt:injekt-core:1.16.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json-okio:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    // ConfigurableSource's PreferenceScreen and SharedPreferences
    implementation 'androidx.preference:preference-ktx:1.2.1'
    // JavaScriptEngine; Mihon uses a JitPack fork of the same library (same package, app.cash.quickjs)
    implementation 'app.cash.quickjs:quickjs-android:0.9.2'
}

android {
    /*******************************************************
     * The following variables:
     * - androidBuildToolsVersion,
     * - androidCompileSdkVersion
     * - qtAndroidDir - holds the path to qt android files
     *                   needed to build any Qt application
     *                   on Android.
     * - qtGradlePluginType - whether to build an app or a library
     *
     * are defined in gradle.properties file. This file is
     * updated by QtCreator and androiddeployqt tools.
     * Changing them manually might break the compilation!
     *******************************************************/

    namespace androidPackageName
    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion
    ndkVersion androidNdkVersion

    // Extract native libraries from the APK
    packagingOptions.jniLibs.useLegacyPackaging true

    // Several of the libraries above carry the same build metadata files
    packagingOptions.resources.excludes += [
        'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
        'META-INF/AL2.0',
        'META-INF/LGPL2.1',
    ]

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            kotlin.srcDirs = ['src', 'java']
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
       }
    }

    tasks.withType(JavaCompile) {
        options.incremental = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        abortOnError false
    }

    // Do not compress Qt binary resources file
    aaptOptions {
        noCompress 'rcc'
    }

    defaultConfig {
        resConfig "en"
        minSdkVersion qtMinSdkVersion
        targetSdkVersion qtTargetSdkVersion
        ndk.abiFilters = qtTargetAbiList.split(",")
    }

    buildTypes {
        release {
            // Extensions resolve the source API and libraries by name: shrinking would break them
            minifyEnabled false
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        // Kotlin 2.2+ compiles interface bodies as JVM default methods plus the DefaultImpls classes that
        // extensions built with older Kotlin call (Mihon keeps Source$DefaultImpls for the same reason)
        jvmDefault.set(org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode.ENABLE)
        freeCompilerArgs.addAll([
            '-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
            '-opt-in=kotlinx.serialization.ExperimentalSerializationApi',
        ])
    }
}
