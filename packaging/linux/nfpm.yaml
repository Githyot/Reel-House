# nfpm (https://nfpm.goreleaser.com) packs the Linux build as a .deb and a .rpm; .github/workflows/linux.yml runs
#   RH_VERSION=0.5.1 nfpm package -f packaging/linux/nfpm.yaml -p deb|rpm
# from the repository root, after linuxdeploy has filled AppDir/usr with the program, Qt, its plugins and QML modules.
# Everything goes to /opt/reelhouse (Qt is bundled: Ubuntu 22.04/24.04 and Debian 12 ship Qt older than the 6.6 the app
# needs); /usr/bin/reelhouse starts it. Video plays through the system's libmpv, a dependency of the package.
name: reelhouse
arch: amd64
platform: linux
version: ${RH_VERSION}
release: 1
section: video
priority: optional
maintainer: Githyot <117548028+Githyot@users.noreply.github.com>
vendor: ReelHouse
homepage: https://github.com/Githyot/ReelHouse
license: GPL-3.0-or-later
description: |-
  ReelHouse media center.
  Video player built on mpv (Stremio addons, Real-Debrid, Anime4K, translated subtitles),
  manga and novel readers, and language study (cards and lessons).

contents:
  - src: ./AppDir/usr/
    dst: /opt/reelhouse/
    type: tree
  - src: /opt/reelhouse/bin/reelhouse-qt
    dst: /usr/bin/reelhouse
    type: symlink
  - src: ./packaging/linux/reelhouse.desktop
    dst: /usr/share/applications/reelhouse.desktop
  - src: ./qt/icon/themes/reelhouse-gnome-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/reelhouse.png
  - src: ./qt/icon/themes/reelhouse-gnome-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/reelhouse.png
  - src: ./qt/icon/themes/reelhouse-gnome.svg
    dst: /usr/share/icons/hicolor/scalable/apps/reelhouse.svg
  - src: ./LICENSE
    dst: /usr/share/doc/reelhouse/LICENSE

# What the bundled Qt and the player take from the system: what linuxdeploy leaves out of AppDir on purpose, and the
# libraries linux.yml removes after it (GLib, D-Bus, PulseAudio, systemd, compression, Kerberos), because the system's
# libmpv needs the system's own versions of them. Qt, ICU, Qt's FFmpeg and the xcb helpers are bundled.
overrides:
  deb:
    depends:
      - libmpv2 | libmpv1
      - libgl1
      - libegl1
      - libopengl0
      - libdrm2
      - libfontconfig1
      - libfreetype6
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libexpat1
      - zlib1g
      - libglib2.0-0t64 | libglib2.0-0
      - libdbus-1-3
      - libpulse0
      - libsystemd0
      - libpng16-16t64 | libpng16-16
      - libzstd1
      - libbz2-1.0
      - liblzma5
      - liblz4-1
      - libbrotli1
      - libgcrypt20
      - libcap2
      - libmount1
      - libblkid1
      - libselinux1
      - libffi8
      - libpcre2-8-0
      - libgssapi-krb5-2
    recommends:
      # the offline voice of Study (Qt's speech-dispatcher backend)
      - libspeechd2
      # Research mode's Chromium (libcef.so); without them pages open in the system browser
      - libnss3
      - libgbm1
      - libasound2t64 | libasound2
      - libatk-bridge2.0-0t64 | libatk-bridge2.0-0
      - libcups2t64 | libcups2
      - libxcomposite1
      - libxdamage1
  rpm:
    depends:
      - libmpv.so.2()(64bit)
      - libGL.so.1()(64bit)
      - libEGL.so.1()(64bit)
      - libOpenGL.so.0()(64bit)
      - libdrm.so.2()(64bit)
      - libfontconfig.so.1()(64bit)
      - libfreetype.so.6()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libxcb.so.1()(64bit)
      - libexpat.so.1()(64bit)
      - libz.so.1()(64bit)
      - libglib-2.0.so.0()(64bit)
      - libgobject-2.0.so.0()(64bit)
      - libgio-2.0.so.0()(64bit)
      - libgmodule-2.0.so.0()(64bit)
      - libgthread-2.0.so.0()(64bit)
      - libdbus-1.so.3()(64bit)
      - libpulse.so.0()(64bit)
      - libsystemd.so.0()(64bit)
      - libpng16.so.16()(64bit)
      - libzstd.so.1()(64bit)
      - libbz2.so.1()(64bit)
      - liblzma.so.5()(64bit)
      - liblz4.so.1()(64bit)
      - libbrotlidec.so.1()(64bit)
      - libgcrypt.so.20()(64bit)
      - libcap.so.2()(64bit)
      - libmount.so.1()(64bit)
      - libblkid.so.1()(64bit)
      - libselinux.so.1()(64bit)
      - libffi.so.8()(64bit)
      - libpcre2-8.so.0()(64bit)
      - libgssapi_krb5.so.2()(64bit)
    recommends:
      - libspeechd.so.2()(64bit)
      - libnss3.so()(64bit)
      - libgbm.so.1()(64bit)
      - libasound.so.2()(64bit)
      - libatk-bridge-2.0.so.0()(64bit)
      - libcups.so.2()(64bit)
      - libXcomposite.so.1()(64bit)
      - libXdamage.so.1()(64bit)
